name: update iptv

on:
  schedule:
    - cron: '0 */4 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:  # 允许手动触发


jobs:
  process-files:
    runs-on: ubuntu-latest

    steps:
      - name: 清除action运行记录（保留10条）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取所有运行记录的ID，按创建时间降序排列（最新的在前）
          gh api repos/${{ github.repository }}/actions/runs \
            --paginate \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .[].id' \
            > all_run_ids.txt

          # 统计总数并跳过前10条（保留最新10条）
          total=$(wc -l < all_run_ids.txt)
          keep=10
          if [ "$total" -le "$keep" ]; then
            echo "当前仅有 $total 条记录，无需删除。"
            exit 0
          fi

          delete_count=$((total - keep))
          echo "将删除 $delete_count 条旧记录..."

          # 从第6行开始读取ID并执行删除
          tail -n +$((keep + 1)) all_run_ids.txt | while read -r run_id; do
            echo "正在删除运行记录 ID: $run_id"
            gh api -X DELETE repos/${{ github.repository }}/actions/runs/$run_id
          done

          echo "清理完成，已保留最新 $keep 条运行记录。"
    
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: update iptv
        run: |
          python3 ./iptv/iptv.py
        env:
          token: ${{ secrets.SECRET_TVBOX }}  # token
          owner: 'niuber'
          repo: 'iptv-api'
          workflow_id: 'main.yml'
          ref: 'master'
